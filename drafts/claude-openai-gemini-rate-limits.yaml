# UNVERIFIED WORKING DATA — DO NOT CONSUME
#
# This is a raw capture of published rate limits for Claude, OpenAI and Gemini. It is
# kept here as the starting point for a sourced pass, NOT as an API Commons artifact.
#
# Known problems, as of this commit:
#   - The numbers have not been re-verified against the providers' own documentation,
#     and no entry carries a url or a source_date.
#   - The model roster is stale (Claude Opus/Sonnet/Haiku 4, Gemini 2.5).
#   - Most entries omit `domains`, and the Gemini section omits it entirely.
#   - Some Gemini entries describe requests per minute but carry `metric: token`.
#
# Fixed in this commit: Anthropic models were tagged with api.openai.com; `tokens` was
# normalised to `token`; comma-formatted limits were converted to numbers.
#
# The published, schema-conformant example is ../rate-limits-example-1.yml.

# Rate Limits
# These are the plans for Claude, OpenAI, and Gemini, providing a machine-readable version of the plans for the platform.

# Claude
- name: Rate Limits
  type: RateLimits
  description: The rate limits for this API.
  url: https://docs.anthropic.com/en/api/rate-limits
  data:
    - name: Claude Opus 4 Input Tokens
      type: Model
      limit: 30000
      metric: token
      domains:
        - api.anthropic.com
      timeframe: minute
      description: The input token limits for the Claude Opus 4 model.
      userMultiplied: false
    - name: Claude Opus 4 Output Tokens
      type: Model
      limit: 80000
      metric: token
      domains:
        - api.anthropic.com
      timeframe: minute
      description: The output token limits for the Claude Opus 4 model.
      userMultiplied: false
    - name: Claude Opus 4 Requests
      type: Model
      limit: 50
      metric: request
      domains:
        - api.anthropic.com
      timeframe: minute
      description: The request limits for the Claude Opus 4 model.
      userMultiplied: false
    - name: Claude Sonnet 4 Input Tokens
      type: Model
      limit: 30000
      metric: token
      domains:
        - api.anthropic.com
      timeframe: minute
      description: The input token limits for the Claude Sonnet 4 model.
      userMultiplied: false
    - name: Claude Sonnet 4 Output Tokens
      type: Model
      limit: 80000
      metric: token
      domains:
        - api.anthropic.com
      timeframe: minute
      description: The output token limits for the Claude Sonnet 4 model.
      userMultiplied: false
    - name: Claude Sonnet 4 Requests
      type: Model
      limit: 50
      metric: request
      domains:
        - api.anthropic.com
      timeframe: minute
      description: The request limits for the Claude Sonnet 4 model.
      userMultiplied: false
    - name: Claude Haiku 4 Input Tokens
      type: Model
      limit: 50000
      metric: token
      domains:
        - api.anthropic.com
      timeframe: minute
      description: The input token limits for the Claude Haiku 4 model.
      userMultiplied: false
    - name: Claude Haiku 4 Output Tokens
      type: Model
      limit: 10000
      metric: token
      domains:
        - api.anthropic.com
      timeframe: minute
      description: The output token limits for the Claude Haiku 4 model.
      userMultiplied: false
    - name: Claude Haiku 4 Requests
      type: Model
      limit: 50
      metric: request
      domains:
        - api.anthropic.com
      timeframe: minute
      description: The request limits for the Claude Haiku 4 model.
      userMultiplied: false

